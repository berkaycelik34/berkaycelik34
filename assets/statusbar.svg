<svg xmlns="http://www.w3.org/2000/svg" width="860" height="60" viewBox="0 0 860 60" role="img" aria-label="status bar with branch domain and contact">
  <defs>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;}
      .bar{fill:#0b0f14;stroke:#243244;stroke-width:1;}
      .git{fill:#22c55e;font-size:13px;}
      .item{fill:#94a3b8;font-size:13px;}
      .end{fill:#a855f7;font-size:13px;}
      .on{fill:#22c55e;font-size:13px;}
      .caret{fill:#a855f7;animation:blink 1.1s steps(1) infinite;}
      @keyframes blink{50%{opacity:0;}}
      svg{animation:boot .55s ease-out both;animation-delay:1.05s;}
      @keyframes boot{from{opacity:0;}to{opacity:1;}}
    </style>
  </defs>

  <rect class="bar" x="1" y="1" width="858" height="58" rx="12"/>

  <line x1="110" y1="12" x2="110" y2="48" stroke="#1b2430"/>
  <line x1="275" y1="12" x2="275" y2="48" stroke="#1b2430"/>
  <line x1="503" y1="12" x2="503" y2="48" stroke="#1b2430"/>
  <line x1="700" y1="12" x2="700" y2="48" stroke="#1b2430"/>

  <text class="mono git" x="24" y="35">&#9095; main</text>
  <text class="mono item" x="134" y="35">celikberkay.com</text>
  <text class="mono item" x="299" y="35">infogit@celikberkay.com</text>
  <text class="mono end" x="527" y="35">uniqlegacy</text>
  <rect class="caret" x="612" y="25" width="8" height="14"/>

  <circle cx="732" cy="30" r="4" fill="#22c55e" opacity=".9"/>
  <text class="mono on" x="744" y="35">shipping</text>
</svg>
