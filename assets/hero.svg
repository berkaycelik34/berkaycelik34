<svg xmlns="http://www.w3.org/2000/svg" width="860" height="250" viewBox="0 0 860 250" role="img" aria-label="Berkay Celik operator console header">
  <defs>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="0.55" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d131b"/>
      <stop offset="1" stop-color="#0a0e13"/>
    </linearGradient>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;}
      .bg{fill:#0b0f14;stroke:#243244;stroke-width:1;}
      .path{fill:#94a3b8;font-size:12px;letter-spacing:.5px;}
      .cmd{fill:#64748b;font-size:15px;}
      .prompt{fill:#22c55e;}
      .flag{fill:#22d3ee;}
      .name{font-size:46px;font-weight:800;letter-spacing:1px;}
      .tag{fill:#94a3b8;font-size:12.5px;letter-spacing:3px;}
      .tagb{fill:#22c55e;font-size:12.5px;letter-spacing:3px;font-weight:700;}
      .badge{fill:#22c55e;font-size:10.5px;letter-spacing:1.8px;}
      .cursor{fill:#22c55e;animation:blink 1s steps(1) infinite;}
      @keyframes blink{50%{opacity:0;}}
      svg{animation:boot .55s ease-out both;}
      @keyframes boot{from{opacity:0;}to{opacity:1;}}
      .gr{animation:gdrift 3s ease-in-out infinite;}
      .gc{animation:gdriftc 3s ease-in-out infinite;}
      @keyframes gdrift{0%,92%,100%{opacity:0;transform:translate(0,0);}94%{opacity:.45;transform:translate(-2px,1px);}97%{opacity:.3;transform:translate(2px,-1px);}}
      @keyframes gdriftc{0%,92%,100%{opacity:0;transform:translate(0,0);}94%{opacity:.45;transform:translate(2px,-1px);}97%{opacity:.3;transform:translate(-2px,1px);}}
    </style>
  </defs>

  <rect class="bg" x="1" y="1" width="858" height="248" rx="14"/>

  <!-- window chrome -->
  <path d="M1 15 A14 14 0 0 1 15 1 H845 A14 14 0 0 1 859 15 V41 H1 Z" fill="url(#chrome)"/>
  <line x1="1" y1="41" x2="859" y2="41" stroke="#1b2430"/>
  <circle cx="24" cy="21" r="5.5" fill="#f43f5e"/>
  <circle cx="42" cy="21" r="5.5" fill="#f5a524"/>
  <circle cx="60" cy="21" r="5.5" fill="#22c55e"/>
  <text class="mono path" x="82" y="25">berkay@celikberkay:~/profile</text>
  <g transform="translate(690,11)">
    <rect x="0" y="0" width="150" height="20" rx="10" fill="none" stroke="#22c55e" stroke-opacity=".35"/>
    <circle cx="14" cy="10" r="3.5" fill="#22c55e" opacity=".9"/>
    <text class="mono badge" x="26" y="14">SESSION ACTIVE</text>
  </g>

  <!-- boot command -->
  <text class="mono cmd" x="30" y="78"><tspan class="prompt">&#10140;</tspan> ./init <tspan class="flag">--operator</tspan> berkaycelik34<tspan class="cursor" dx="4">&#9614;</tspan></text>

  <!-- glitch name -->
  <g class="mono" transform="translate(30,145)">
    <text class="name gc" fill="#22d3ee">BERKAY &#199;EL&#304;K</text>
    <text class="name gr" fill="#a855f7">BERKAY &#199;EL&#304;K</text>
    <text class="name" fill="url(#name)">BERKAY &#199;EL&#304;K</text>
  </g>

  <!-- tagline -->
  <text class="mono tag" x="30" y="188">LOW-NOISE BUILDS &#183; HIGH-SIGNAL SYSTEMS</text>
  <text class="mono" x="30" y="212"><tspan class="tag">// </tspan><tspan class="tagb">THE HOUSE ALWAYS SHIPS</tspan></text>
</svg>
