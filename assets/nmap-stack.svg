<svg xmlns="http://www.w3.org/2000/svg" width="860" height="260" viewBox="0 0 860 260" role="img" aria-label="nmap style tech stack port scan">
  <defs>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;}
      .cmd{fill:#64748b;font-size:17px;}
      .prompt{fill:#22c55e;}
      .flag{fill:#22d3ee;}
      .panel{fill:#0b0f14;stroke:#1b2430;stroke-width:1;}
      .head{fill:#475569;font-size:11px;letter-spacing:1px;}
      .port{fill:#22d3ee;font-size:13px;}
      .st{fill:#22c55e;font-size:13px;}
      .svc{fill:#e5e7eb;font-size:13px;}
      .muted{fill:#64748b;font-size:13px;}
      .scanline{stroke:#22c55e;stroke-width:1;opacity:0;animation:sweep 3s ease-in-out infinite;}
      @keyframes sweep{0%{opacity:0;transform:translateY(0);}10%{opacity:.5;}90%{opacity:.5;}100%{opacity:0;transform:translateY(150px);}}
      svg{animation:boot .55s ease-out both;animation-delay:.45s;}
      @keyframes boot{from{opacity:0;}to{opacity:1;}}
    </style>
  </defs>

  <text class="mono cmd" x="8" y="20"><tspan class="prompt">&#10140;</tspan> nmap <tspan class="flag">-sV</tspan> stack.berkay.dev</text>

  <g transform="translate(8,34)">
    <rect class="panel" x="0" y="0" width="844" height="220" rx="10"/>
    <line class="scanline" x1="12" y1="60" x2="832" y2="60"/>

    <g class="mono">
      <text class="head" x="20" y="30">PORT</text>
      <text class="head" x="150" y="30">STATE</text>
      <text class="head" x="250" y="30">SERVICE</text>
      <text class="head" x="420" y="30">VERSION</text>
      <line x1="20" y1="42" x2="824" y2="42" stroke="#1b2430"/>

      <text class="port" x="20" y="72">443/tls</text>
      <text class="st"   x="150" y="72">open</text>
      <text class="svc"  x="250" y="72">frontend</text>
      <text class="muted" x="420" y="72">react &#183; next &#183; tailwind</text>

      <text class="port" x="20" y="102">8080/http</text>
      <text class="st"   x="150" y="102">open</text>
      <text class="svc"  x="250" y="102">backend</text>
      <text class="muted" x="420" y="102">node &#183; python &#183; postgres</text>

      <text class="port" x="20" y="132">3000/ws</text>
      <text class="st"   x="150" y="132">open</text>
      <text class="svc"  x="250" y="132">design</text>
      <text class="muted" x="420" y="132">figma &#183; motion &#183; brand</text>

      <text class="port" x="20" y="162">22/ssh</text>
      <text class="st"   x="150" y="162">open</text>
      <text class="svc"  x="250" y="162">devops</text>
      <text class="muted" x="420" y="162">docker &#183; ci/cd &#183; vercel</text>

      <text class="port" x="20" y="192">6443/tcp</text>
      <text class="st"   x="150" y="192">open</text>
      <text class="svc"  x="250" y="192">orchestration</text>
      <text class="muted" x="420" y="192">kubernetes &#183; helm &#183; kubectl</text>
    </g>
  </g>
</svg>
