<svg xmlns="http://www.w3.org/2000/svg" width="860" height="290" viewBox="0 0 860 290" role="img" aria-label="biometric scan of profile avatar">
  <defs>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;}
      .cmd{fill:#64748b;font-size:14px;}
      .prompt{fill:#22c55e;}
      .flag{fill:#22d3ee;}
      .panel{fill:#0b0f14;stroke:#243244;stroke-width:1;}
      .k{fill:#475569;font-size:12.5px;}
      .v{fill:#e5e7eb;font-size:12.5px;}
      .ok{fill:#22c55e;font-size:12.5px;}
      .cy{fill:#22d3ee;font-size:12.5px;}
      .hex{fill:#22c55e;font-size:9px;opacity:.28;}
      .bracket{stroke:#22d3ee;stroke-width:2;fill:none;}
      .scanline{animation:sweep 3.4s ease-in-out infinite;}
      @keyframes sweep{0%{transform:translateY(0);opacity:0;}8%{opacity:.85;}46%{opacity:.85;}50%{transform:translateY(176px);opacity:0;}54%{opacity:.85;}92%{opacity:.85;}100%{transform:translateY(0);opacity:0;}}
      .gridfade{animation:gpulse 3.4s ease-in-out infinite;}
      @keyframes gpulse{0%,100%{opacity:.14;}50%{opacity:.32;}}
      .ring{transform-origin:139px 158px;animation:rot 9s linear infinite;}
      @keyframes rot{to{transform:rotate(360deg);}}
      .ring2{transform-origin:139px 158px;animation:rot2 6s linear infinite;}
      @keyframes rot2{to{transform:rotate(-360deg);}}
      .blinkc{animation:blink 1s steps(1) infinite;}
      @keyframes blink{50%{opacity:0;}}
      .p-fill{animation:pfill 3.4s ease-in-out infinite;}
      @keyframes pfill{0%{width:24px;}45%{width:196px;}55%{width:196px;}100%{width:24px;}}
      .matchflash{animation:mflash 3.4s ease-in-out infinite;}
      @keyframes mflash{0%,40%{opacity:.25;}50%,90%{opacity:1;}100%{opacity:.25;}}
      .tick{animation:tickmove 1.1s steps(4) infinite;}
      @keyframes tickmove{to{transform:translateX(-16px);}}
    </style>
    <clipPath id="face"><rect x="51" y="70" width="176" height="176" rx="14"/></clipPath>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#22c55e" stop-opacity=".28"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity=".85"/>
    </linearGradient>
  </defs>

  <text class="mono cmd" x="8" y="20"><tspan class="prompt">&#10140;</tspan> ./scan <tspan class="flag">--biometric</tspan> avatar.png</text>

  <g transform="translate(8,34)">
    <rect class="panel" x="0" y="0" width="844" height="248" rx="10"/>

    <!-- ===== left: avatar scan frame ===== -->
    <!-- rotating rings -->
    <g class="ring" opacity=".5">
      <circle cx="139" cy="158" r="112" fill="none" stroke="#1b2430" stroke-width="1"/>
      <path d="M139 46 a112 112 0 0 1 79 33" fill="none" stroke="#22d3ee" stroke-width="2"/>
      <path d="M139 270 a112 112 0 0 1 -79 -33" fill="none" stroke="#a855f7" stroke-width="2"/>
    </g>
    <g class="ring2" opacity=".35">
      <circle cx="139" cy="158" r="101" fill="none" stroke="#1b2430" stroke-width="1"/>
      <path d="M139 57 a101 101 0 0 0 -71 30" fill="none" stroke="#22c55e" stroke-width="1.6"/>
    </g>

    <!-- avatar (clipped) -->
    <g clip-path="url(#face)" transform="translate(-8,-34)">
      <image href="data:image/jpeg;base64," x="51" y="70" width="176" height="176" preserveAspectRatio="xMidYMid slice"/>
      <!-- green tint + grid -->
      <rect x="51" y="70" width="176" height="176" fill="#22c55e" opacity=".07"/>
      <g class="gridfade" stroke="#22c55e" stroke-width="1">
        <line x1="51" y1="114" x2="227" y2="114"/><line x1="51" y1="158" x2="227" y2="158"/><line x1="51" y1="202" x2="227" y2="202"/>
        <line x1="95" y1="70" x2="95" y2="246"/><line x1="139" y1="70" x2="139" y2="246"/><line x1="183" y1="70" x2="183" y2="246"/>
      </g>
      <!-- sweeping beam -->
      <g class="scanline">
        <rect x="51" y="42" width="176" height="28" fill="url(#beam)"/>
        <rect x="51" y="69" width="176" height="2" fill="#22c55e" opacity=".9"/>
      </g>
    </g>

    <!-- corner brackets -->
    <g class="bracket">
      <path d="M43 62 v-16 h16"/><path d="M219 46 h16 v16"/>
      <path d="M235 196 v16 h-16"/><path d="M59 212 h-16 v-16"/>
    </g>

    <!-- ===== right: analysis readout ===== -->
    <g class="mono" transform="translate(300,36)">
      <text class="k" x="0" y="0">ANALYZING</text>
      <rect x="96" y="-10" width="200" height="12" rx="6" fill="#070b10" stroke="#1b2430"/>
      <rect class="p-fill" x="98" y="-8" height="8" rx="4" fill="#22c55e" opacity=".8"/>

      <text class="k" x="0" y="34">SUBJECT</text><text class="v" x="150" y="34">Berkay &#199;elik</text>
      <text class="k" x="0" y="60">ALIAS</text><text class="cy" x="150" y="60">uniqlegacy</text>
      <text class="k" x="0" y="86">MATCH</text><text class="ok matchflash" x="150" y="86">&#10003; CONFIRMED &#183; 99.97%</text>
      <text class="k" x="0" y="112">CLASS</text><text class="v" x="150" y="112">tech &#183; design &#183; strategy</text>
      <text class="k" x="0" y="138">THREAT LEVEL</text><text class="v" x="150" y="138">creative</text>
      <text class="k" x="0" y="164">SIGNATURE</text><text class="v" x="150" y="164">low-noise &#183; high-signal</text>

      <!-- hex stream -->
      <g class="tick">
        <text class="hex" x="0" y="196">9f a3 0c 7b 2e 11 4d c1 04 ff 8a 66 2b de ad be ef 13 37 0a 5c 91 e0 77 3d</text>
      </g>
      <text class="k" x="0" y="196" opacity="0">.</text>
      <rect class="blinkc" x="0" y="204" width="8" height="13" fill="#22c55e"/>
    </g>
  </g>
</svg>
