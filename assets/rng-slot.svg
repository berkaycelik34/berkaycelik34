<svg xmlns="http://www.w3.org/2000/svg" width="860" height="170" viewBox="0 0 860 170" role="img" aria-label="RNG exploit slot module">
  <defs>
    <linearGradient id="neon" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="seven" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="gemg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="bellg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- ===== vector reel symbols (centered at 0,0) ===== -->
    <g id="sym-gem">
      <polygon points="0,-14 10,-6 0,14 -10,-6" fill="url(#gemg)" stroke="#a5f3fc" stroke-width="1"/>
      <polyline points="-10,-6 0,-2 10,-6" fill="none" stroke="#a5f3fc" stroke-width="1" opacity=".8"/>
      <line x1="0" y1="-2" x2="0" y2="14" stroke="#0e7490" stroke-width="1" opacity=".8"/>
      <polygon points="-3.5,-10.5 -1,-8 -4.5,-7" fill="#ecfeff" opacity=".85"/>
    </g>
    <g id="sym-bell">
      <path d="M0,-13 C7,-13 9,-7 9,-1 C9,4 11,7 12,8 L-12,8 C-11,7 -9,4 -9,-1 C-9,-7 -7,-13 0,-13 Z" fill="url(#bellg)" stroke="#fcd34d" stroke-width="0.8"/>
      <rect x="-2.5" y="-15.5" width="5" height="4" rx="2" fill="#fcd34d"/>
      <circle cx="0" cy="11.5" r="3" fill="#fbbf24" stroke="#92400e" stroke-width="0.6"/>
      <path d="M-5,-9 C-7,-7 -7.5,-3 -7.5,0" fill="none" stroke="#fef3c7" stroke-width="1.1" opacity=".7"/>
    </g>
    <g id="sym-cherry">
      <path d="M-4,7 C-8,-2 -4,-10 5,-14" fill="none" stroke="#4ade80" stroke-width="1.6"/>
      <path d="M7,8 C6,-1 6,-8 5,-14" fill="none" stroke="#4ade80" stroke-width="1.6"/>
      <path d="M5,-14 C8,-15 11,-14 13,-12 C10,-12 8,-13 5,-14 Z" fill="#22c55e"/>
      <circle cx="-4" cy="8" r="6" fill="#e11d48" stroke="#fb7185" stroke-width="0.8"/>
      <circle cx="7" cy="9" r="6" fill="#be123c" stroke="#fb7185" stroke-width="0.8"/>
      <ellipse cx="-6" cy="6" rx="2" ry="1.3" fill="#fda4af" opacity=".7" transform="rotate(-30 -6 6)"/>
    </g>
    <g id="sym-bar">
      <rect x="-16" y="-9" width="32" height="18" rx="4" fill="#0f1620" stroke="url(#neon)" stroke-width="1.2"/>
      <text x="0" y="4.5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="800" fill="#e5e7eb" letter-spacing="1">BAR</text>
    </g>
    <g id="sym-seven" filter="url(#softglow)">
      <text x="0" y="12" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="36" font-weight="800" fill="url(#seven)" stroke="#fecdd3" stroke-width="0.5">7</text>
    </g>

    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;}
      .cmd{fill:#64748b;font-size:14px;}
      .prompt{fill:#22c55e;}
      .flag{fill:#22d3ee;}
      .panel{fill:#0b0f14;stroke:#243244;stroke-width:1;}
      .reelbox{fill:#070b10;stroke:#243244;stroke-width:1;}
      .t{fill:#e5e7eb;font-size:15px;}
      .s{fill:#64748b;font-size:12px;}
      .chip{fill:#f43f5e;font-size:11px;letter-spacing:1.5px;}
      .r1{animation:spin1 3.6s cubic-bezier(.15,.85,.2,1) infinite;}
      .r2{animation:spin2 4s cubic-bezier(.15,.85,.2,1) infinite;}
      .r3{animation:spin3 4.4s cubic-bezier(.15,.85,.2,1) infinite;}
      @keyframes spin1{0%{transform:translateY(0);}72%,100%{transform:translateY(-240px);}}
      @keyframes spin2{0%{transform:translateY(0);}76%,100%{transform:translateY(-240px);}}
      @keyframes spin3{0%{transform:translateY(0);}80%,100%{transform:translateY(-240px);}}
      .chipwrap{animation:pulse 1.6s ease-in-out infinite;}
      @keyframes pulse{0%,100%{opacity:.45;}50%{opacity:1;}}
    </style>
    <clipPath id="c1"><rect x="12" y="8" width="52" height="60" rx="8"/></clipPath>
    <clipPath id="c2"><rect x="72" y="8" width="52" height="60" rx="8"/></clipPath>
    <clipPath id="c3"><rect x="132" y="8" width="52" height="60" rx="8"/></clipPath>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".55"/>
      <stop offset="0.25" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.75" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".55"/>
    </linearGradient>
  </defs>

  <text class="mono cmd" x="8" y="20"><tspan class="prompt">&#10140;</tspan> ./rng <tspan class="flag">--exploit</tspan> house-edge</text>

  <g transform="translate(8,34)">
    <rect class="panel" x="0" y="0" width="844" height="120" rx="10"/>

    <!-- reels -->
    <g transform="translate(24,26)">
      <rect class="reelbox" x="12" y="8" width="52" height="60" rx="8"/>
      <rect class="reelbox" x="72" y="8" width="52" height="60" rx="8"/>
      <rect class="reelbox" x="132" y="8" width="52" height="60" rx="8"/>

      <g clip-path="url(#c1)"><g class="r1">
        <use href="#sym-gem"    transform="translate(38,38)"/>
        <use href="#sym-bell"   transform="translate(38,98)"/>
        <use href="#sym-cherry" transform="translate(38,158)"/>
        <use href="#sym-seven"  transform="translate(38,218)"/>
        <use href="#sym-seven"  transform="translate(38,278)"/>
      </g></g>
      <g clip-path="url(#c2)"><g class="r2">
        <use href="#sym-bar"    transform="translate(98,38)"/>
        <use href="#sym-gem"    transform="translate(98,98)"/>
        <use href="#sym-bell"   transform="translate(98,158)"/>
        <use href="#sym-seven"  transform="translate(98,218)"/>
        <use href="#sym-seven"  transform="translate(98,278)"/>
      </g></g>
      <g clip-path="url(#c3)"><g class="r3">
        <use href="#sym-bell"   transform="translate(158,38)"/>
        <use href="#sym-cherry" transform="translate(158,98)"/>
        <use href="#sym-gem"    transform="translate(158,158)"/>
        <use href="#sym-seven"  transform="translate(158,218)"/>
        <use href="#sym-seven"  transform="translate(158,278)"/>
      </g></g>

      <!-- top/bottom shading for depth -->
      <rect x="12" y="8" width="52" height="60" rx="8" fill="url(#shade)" pointer-events="none"/>
      <rect x="72" y="8" width="52" height="60" rx="8" fill="url(#shade)" pointer-events="none"/>
      <rect x="132" y="8" width="52" height="60" rx="8" fill="url(#shade)" pointer-events="none"/>

      <!-- payline -->
      <line x1="6" y1="38" x2="190" y2="38" stroke="#f43f5e" stroke-width="1" stroke-dasharray="3 4" opacity=".35"/>
    </g>

    <!-- meta -->
    <g class="mono" transform="translate(250,52)">
      <text class="t" x="0" y="0">Algoritma her zaman kazan&#305;r</text>
      <text class="s" x="0" y="22">seed predicted &#183; house edge = 100% &#183; the algorithm always wins</text>
    </g>

    <!-- jackpot chip -->
    <g class="chipwrap" transform="translate(720,42)">
      <rect x="0" y="0" width="100" height="34" rx="7" fill="none" stroke="#f43f5e" stroke-opacity=".45"/>
      <text class="mono chip" x="24" y="22">JACKPOT</text>
    </g>
  </g>
</svg>
