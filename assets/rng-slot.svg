<svg xmlns="http://www.w3.org/2000/svg" width="860" height="170" viewBox="0 0 860 170" role="img" aria-label="RNG exploit slot module">
  <defs>
    <linearGradient id="neon" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;}
      .cmd{fill:#64748b;font-size:14px;}
      .prompt{fill:#22c55e;}
      .flag{fill:#22d3ee;}
      .panel{fill:#0b0f14;stroke:#243244;stroke-width:1;}
      .reelbox{fill:#070b10;stroke:#243244;stroke-width:1;}
      .sym{font-size:30px;}
      .t{fill:#e5e7eb;font-size:15px;}
      .s{fill:#64748b;font-size:12px;}
      .chip{fill:#f43f5e;font-size:11px;letter-spacing:1.5px;}
      .r1{animation:spin1 3.6s cubic-bezier(.15,.85,.2,1) infinite;}
      .r2{animation:spin2 4s cubic-bezier(.15,.85,.2,1) infinite;}
      .r3{animation:spin3 4.4s cubic-bezier(.15,.85,.2,1) infinite;}
      @keyframes spin1{0%{transform:translateY(0);}72%,100%{transform:translateY(-240px);}}
      @keyframes spin2{0%{transform:translateY(0);}76%,100%{transform:translateY(-240px);}}
      @keyframes spin3{0%{transform:translateY(0);}80%,100%{transform:translateY(-240px);}}
      .chipwrap{animation:pulse 1.6s ease-in-out infinite;}
      @keyframes pulse{0%,100%{opacity:.45;}50%{opacity:1;}}
    </style>
    <clipPath id="c1"><rect x="12" y="8" width="52" height="60" rx="8"/></clipPath>
    <clipPath id="c2"><rect x="72" y="8" width="52" height="60" rx="8"/></clipPath>
    <clipPath id="c3"><rect x="132" y="8" width="52" height="60" rx="8"/></clipPath>
  </defs>

  <text class="mono cmd" x="8" y="20"><tspan class="prompt">&#10140;</tspan> ./rng <tspan class="flag">--exploit</tspan> house-edge</text>

  <g transform="translate(8,34)">
    <rect class="panel" x="0" y="0" width="844" height="120" rx="10"/>

    <!-- reels -->
    <g transform="translate(24,26)">
      <rect class="reelbox" x="12" y="8" width="52" height="60" rx="8"/>
      <rect class="reelbox" x="72" y="8" width="52" height="60" rx="8"/>
      <rect class="reelbox" x="132" y="8" width="52" height="60" rx="8"/>

      <g clip-path="url(#c1)"><g class="mono sym r1" transform="translate(0,8)">
        <text x="26" y="38" text-anchor="middle">&#128142;</text>
        <text x="26" y="98" text-anchor="middle">&#128276;</text>
        <text x="26" y="158" text-anchor="middle">&#127826;</text>
        <text x="26" y="218" text-anchor="middle">7&#65039;&#8419;</text>
        <text x="26" y="278" text-anchor="middle">7&#65039;&#8419;</text>
      </g></g>
      <g clip-path="url(#c2)"><g class="mono sym r2" transform="translate(60,8)">
        <text x="26" y="38" text-anchor="middle">&#127819;</text>
        <text x="26" y="98" text-anchor="middle">&#128142;</text>
        <text x="26" y="158" text-anchor="middle">&#128276;</text>
        <text x="26" y="218" text-anchor="middle">7&#65039;&#8419;</text>
        <text x="26" y="278" text-anchor="middle">7&#65039;&#8419;</text>
      </g></g>
      <g clip-path="url(#c3)"><g class="mono sym r3" transform="translate(120,8)">
        <text x="26" y="38" text-anchor="middle">&#128276;</text>
        <text x="26" y="98" text-anchor="middle">&#127826;</text>
        <text x="26" y="158" text-anchor="middle">&#128142;</text>
        <text x="26" y="218" text-anchor="middle">7&#65039;&#8419;</text>
        <text x="26" y="278" text-anchor="middle">7&#65039;&#8419;</text>
      </g></g>
    </g>

    <!-- meta -->
    <g class="mono" transform="translate(250,52)">
      <text class="t" x="0" y="0">Algoritma her zaman kazan&#305;r</text>
      <text class="s" x="0" y="22">seed predicted &#183; house edge = 100% &#183; the algorithm always wins</text>
    </g>

    <!-- jackpot chip -->
    <g class="chipwrap" transform="translate(720,42)">
      <rect x="0" y="0" width="100" height="34" rx="7" fill="none" stroke="#f43f5e" stroke-opacity=".45"/>
      <text class="mono chip" x="24" y="22">JACKPOT</text>
    </g>
  </g>
</svg>
